<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8558782654238683"
     crossorigin="anonymous"></script>
    <title>Percentage Calculator – SmartDailyTools</title>
    <meta
      name="description"
      content="Calculate percentage increase, decrease or percentage of any number instantly."
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="canonical"
      href="https://www.smartdailytools.in/percentage-calculator.html"
    />
  </head>

  <body>
    <nav class="navbar">
      <h1 class="logo">SmartDailyTools</h1>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="about.html">About</a>
      </div>
      <button id="themeToggle" class="theme-btn">🌙</button>
    </nav>

    <section class="page-container">
      <div class="tool-card fade-in-up">
        <h1>Percentage Calculator</h1>
        <p class="tool-desc">Find percentage of any value quickly.</p>

       <!-- Mode selector -->
<select id="percentMode" onchange="switchPercentMode()">
  <option value="basic">📊 Basic Percentage</option>
  <option value="reverse">🧠 Reverse % (Find Original)</option>
  <option value="change">🔄 Increase / Decrease %</option>
  <option value="pl">📈 Profit / Loss %</option>
</select>

<!-- BASIC MODE (default) -->
<div class="percent-mode" id="mode-basic">
  <input type="number" id="percentValue" placeholder="Value (Part)" />
  <input type="number" id="percentTotal" placeholder="Total" />
</div>

<!-- REVERSE MODE -->
<div class="percent-mode" id="mode-reverse" style="display:none;">
  <input type="number" id="finalValue" placeholder="Final value" />
  <input type="number" id="revPercent" placeholder="Percentage" />
  <select id="revType">
    <option value="increase">After Increase</option>
    <option value="decrease">After Decrease</option>
  </select>
</div>

<!-- INCREASE / DECREASE -->
<div class="percent-mode" id="mode-change" style="display:none;">
  <input type="number" id="oldValue" placeholder="Old value" />
  <input type="number" id="newValue" placeholder="New value" />
</div>

<!-- PROFIT / LOSS -->
<div class="percent-mode" id="mode-pl" style="display:none;">
  <input type="number" id="costPrice" placeholder="Cost price" />
  <input type="number" id="sellingPrice" placeholder="Selling price" />
</div>

        <button class="primary-btn" onclick="calculatePercentage()">
          Calculate
        </button>
        <div id="percentageResult" class="result-box"></div>
        <div id="aiInsight" class="ai-insight hidden">
          <div class="ai-icon">🤖</div>
          <div class="ai-text" id="aiInsightText"></div>
        </div>

        <div class="tool-content">
          <h2>About</h2>
          <p>
            Helpful for exams, finance calculations, discounts and daily math
            problems.
          </p>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-links">
        <a href="contact.html">Contact</a>
        <a href="privacy.html"> Privacy Policy</a>
        <a href="terms.html"> Terms & Conditions</a>
      </div>
      <p>© 2026 SmartDailyTools.in | Made with ❤️ in India</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
