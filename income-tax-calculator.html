<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Income Tax Calculator – SmartDailyTools</title>
<meta name="description" content="Calculate income tax in India using the latest FY 2025-26 tax slabs.">

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
  <h1 class="logo">SmartDailyTools</h1>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="blog.html">Blog</a>
    <a href="about.html">About</a>
  </div>
  <button id="themeToggle" class="theme-btn">🌙</button>
</nav>

<section class="page-container">
  <div class="tool-card fade-in-up">

    <h1>Income Tax Calculator</h1>
    <p class="tool-desc">Calculate tax using FY 2025-26 New & Old regime.</p>

    <input type="number" id="incomeAmount" placeholder="Annual Income (₹)">
    
    <select id="taxRegime" class="tool-card input">
      <option value="new">New Regime</option>
      <option value="old">Old Regime</option>
    </select>

    <label style="display:block; margin:10px 0;">
      <input type="checkbox" id="isSalaried"> Salaried (₹75k standard deduction)
    </label>

    <button class="primary-btn" onclick="calculateIncomeTax()">Calculate Tax</button>

    <div id="taxResult" class="result-box"></div>

    <div class="tool-content">
      <h2>About</h2>
      <p>This calculator follows latest Indian income tax rules for FY 2025-26.</p>
    </div>

  </div>
</section>

<footer class="footer">
  <div class="footer-links">
    <a href="contact.html">Contact</a>
    <a href="privacy.html">Privacy Policy</a>

  </div>
  <p>© 2026 SmartDailyTools.in | Made with ❤️ in India</p>
</footer>

<script src="script.js"></script>
</body>
</html>
