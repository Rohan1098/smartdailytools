<!-- AI Blog Generator -->
<section class="tool-card fade-in-up">
  <h2 class="tool-title">🤖 AI Blog Generator</h2>
  <p class="tool-subtitle">Create SEO-optimized blog posts instantly.</p>

  <div class="input-group">
    <label for="blogTopic">Blog Topic</label>
    <input
      type="text"
      id="blogTopic"
      class="input-field"
      placeholder="e.g. Best SIP plans in India"
    />
  </div>

  <button id="generateBlog" class="btn-primary">
    Generate Blog
  </button>

  <div id="blogLoading" class="loader hidden"></div>

  <div id="blogResult" class="result-card hidden"></div>
</section>
