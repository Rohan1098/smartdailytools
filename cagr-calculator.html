<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>CAGR Calculator – SmartDailyTools</title>
<meta name="description" content="Calculate Compound Annual Growth Rate (CAGR) of your investments easily.">
<link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="navbar">
  <h1 class="logo">SmartDailyTools</h1>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="blog.html">Blog</a>
    <a href="about.html">About</a>
  </div>

</nav>

<section class="page-container">
  <div class="tool-card fade-in-up">
    <h1>CAGR Calculator</h1>
    <p class="tool-desc">Measure your investment growth rate annually.</p>

    <input type="number" id="cagrStart" placeholder="Starting Value">
    <input type="number" id="cagrEnd" placeholder="Ending Value">
    <input type="number" id="cagrYears" placeholder="Years">

    <button class="primary-btn" onclick="calculateCAGR()">Calculate CAGR</button>
    <div id="cagrResult" class="result-box"></div>

    <div class="tool-content">
      <h2>About</h2>
      <p>CAGR helps investors understand the average yearly return of investments over time.</p>
